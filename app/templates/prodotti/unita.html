{% extends "base.html" %}
{% block title %}Unità di misura{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<h1 class="h3 mb-3">Unità di misura</h1>
<div class="card mb-3"><div class="card-body">
  <form method="post" class="row g-2">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="col-md-6"><input class="form-control" name="nome" placeholder="Nome (es. Risme)" required></div>
    <div class="col-md-3"><input class="form-control" name="simbolo" placeholder="Simbolo" required></div>
    <div class="col-md-3"><button class="btn btn-primary w-100">Aggiungi</button></div>
  </form>
</div></div>
<div class="card"><div class="card-body p-0">
<table class="table mb-0">
  <thead><tr><th>Nome</th><th>Simbolo</th><th></th></tr></thead>
  <tbody>
  {% for u in elenco %}
    <tr><td>{{ u.nome }}</td><td><code>{{ u.simbolo }}</code></td>
      <td class="text-end">
        {% if u.id in in_uso %}<span class="small text-muted">in uso</span>
        {% else %}
        <form method="post" action="{{ url_for('prodotti.elimina_unita', uid=u.id) }}" class="d-inline">
          <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
          <button class="btn btn-sm btn-outline-danger">Elimina</button>
        </form>
        {% endif %}
      </td></tr>
  {% endfor %}
  </tbody>
</table>
</div></div>
</div></div>
{% endblock %}
