{% extends "base.html" %}
{% block title %}Accedi{% endblock %}
{% block content %}
<div class="login-box">
  <div class="card">
    <div class="card-body p-4">
      <h1 class="h4 mb-4 text-center"><i class="bi bi-box-seam"></i> Gestionale Magazzino</h1>
      <form method="post">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" required autofocus
                 value="{{ request.form.get('email', '') }}">
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required>
        </div>
        <button class="btn btn-primary w-100">Accedi</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
